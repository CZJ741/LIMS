version: '3.8'

services:
  # 1. MySQL 5.7
  lims-mysql:
    image: mysql:5.7
    container_name: lims-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lims
      MYSQL_USER: lims_user
      MYSQL_PASSWORD: lims_staging_pwd
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_connections=1000
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - lims-net

  # 2. Redis 7
  lims-redis:
    image: redis:7.2-alpine
    container_name: lims-redis
    restart: always
    command: redis-server --requirepass redis_staging_pwd --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - lims-net

  # 3. MinIO 对象存储
  lims-minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: lims-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lims-net

  # 4. 后端应用 (Spring Boot 3)
  lims-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lims-app:1.0.0
    container_name: lims-app
    restart: always
    depends_on:
      - lims-mysql
      - lims-redis
      - lims-minio
    environment:
      SPRING_PROFILES_ACTIVE: staging
    volumes:
      - app_logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - lims-net

  # 5. Nginx 反向代理与网关
  lims-nginx:
    image: nginx:1.25-alpine
    container_name: lims-nginx
    restart: always
    depends_on:
      - lims-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - lims-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  app_logs:
    driver: local

networks:
  lims-net:
    driver: bridge
