server:
  port: 8080
  servlet:
    context-path: /

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/lims?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: rootpassword
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            minimum-idle: 5
            maximum-pool-size: 20
            idle-timeout: 30000
            pool-name: LimsHikariCP-Dev
            max-lifetime: 1800000
            connection-timeout: 30000
            connection-test-query: SELECT 1

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      timeout: 5000ms

# Redisson 配置
redisson:
  singleServerConfig:
    address: "redis://localhost:6379"
    password: null
    database: 0
    timeout: 3000

# MyBatis-Plus Dev 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lims.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
