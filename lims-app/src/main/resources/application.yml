spring:
  profiles:
    active: dev
  application:
    name: lims-service
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-body: false
  is-read-head: true
  is-read-cookie: false
  token-prefix: "Bearer"
  jwt-secret-key: lims_enterprise_secret_key_2024_secure_and_strong_lims

# Flowable 配置
flowable:
  process-definition-location-prefix: classpath*:/processes/
  check-process-definitions: false
  database-schema-update: "false" # 关闭自动建表，由DDL脚本显式管控
  async-executor-activate: true
  history-level: full

# SpringDoc OpenAPI 规范
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# MinIO 基础配置
minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: lims-bucket
