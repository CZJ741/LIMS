<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LIMS 协同助手</title>
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .title { font-weight: bold; font-size: 14px; color: #333; }
    .status-badge {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e6f7ff;
      color: #1890ff;
    }
    .connected { background: #f6ffed; color: #52c41a; }
    .section { margin-top: 12px; }
    .btn {
      width: 100%;
      background: #1890ff;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #40a9ff; }
    .logs {
      font-size: 11px;
      color: #666;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      max-height: 100px;
      overflow-y: auto;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">LIMS 协同助手</span>
    <span id="connStatus" class="status-badge">检测中...</span>
  </div>
  <div class="section">
    <button id="btnConnect" class="btn">连接本地 Native Host</button>
  </div>
  <div class="section">
    <div style="font-size: 12px; font-weight: bold;">通信日志</div>
    <div id="logBox" class="logs">助手已启动，等待指令...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
