<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIMS 实验室信息管理系统 - 统一登录</title>
  <!-- 本地优先，CDN 自动兜底 -->
  <link rel="stylesheet" href="static/css/element-plus.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.min.css';">
  <script src="static/js/vue.global.prod.js"></script>
  <script>
    if (!window.Vue) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3.3.11/dist/vue.global.prod.js"><\/script>');
    }
  </script>
  <script src="static/js/element-plus.full.min.js"></script>
  <script>
    if (!window.ElementPlus) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.full.min.js"><\/script>');
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #f0f2f5;
    }
    .login-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    /* 左侧品牌科技插图与宣传区 (还原目标系统 100% 科技工业蓝基调) */
    .login-left {
      flex: 1.2;
      background: linear-gradient(135deg, #0b1e36 0%, #153a6b 50%, #0d284d 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      color: #ffffff;
      padding: 40px;
    }
    .login-left::before {
      content: "";
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle at 30% 30%, rgba(24, 144, 255, 0.25) 0%, transparent 60%);
      pointer-events: none;
    }
    .particles-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.7;
    }
    .brand-hero {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 580px;
    }
    .brand-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      background: rgba(24, 144, 255, 0.2);
      border: 2px solid rgba(64, 169, 255, 0.4);
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .brand-hero h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #ffffff 0%, #bae7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-hero p {
      font-size: 15px;
      line-height: 1.7;
      color: #91d5ff;
      margin-bottom: 30px;
    }
    .feature-tags {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .feature-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      color: #e6f7ff;
    }

    /* 右侧登录表单面板 */
    .login-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 40px;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
    }
    .login-header {
      margin-bottom: 34px;
    }
    .login-header .badge {
      font-size: 12px;
      color: #1890ff;
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .login-header h2 {
      font-size: 24px;
      color: #1f2d3d;
      margin-top: 10px;
      font-weight: 600;
    }
    .login-header .sub {
      color: #8c939d;
      font-size: 13px;
      margin-top: 6px;
    }
    .el-input {
      --el-input-height: 44px;
    }
    .login-btn {
      width: 100%;
      height: 44px;
      font-size: 16px;
      letter-spacing: 4px;
      font-weight: 500;
      border-radius: 6px;
      background: linear-gradient(90deg, #1890ff 0%, #096dd9 100%);
      border: none;
    }
    .login-btn:hover {
      background: linear-gradient(90deg, #40a9ff 0%, #1890ff 100%);
    }
    .demo-hint-card {
      margin-top: 24px;
      background: #fafafa;
      border: 1px dashed #d9d9d9;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      color: #595959;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .demo-hint-card b {
      color: #1890ff;
    }
    .footer-copy {
      position: absolute;
      bottom: 24px;
      color: #bfbfbf;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-container">
      <!-- 左侧品牌展示区 -->
      <div class="login-left">
        <div class="particles-grid"></div>
        <div class="brand-hero">
          <div class="brand-logo-badge">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#40a9ff" stroke-width="2">
              <path d="M10 2v7.31M14 9.3V1.99M8.5 2h7M14 9.3a6.5 6.5 0 1 1-4 0"/>
              <path d="M5.52 16h12.96"/>
            </svg>
          </div>
          <h1>LIMS 实验室信息管理系统</h1>
          <p>标准化环境与质量检测全流程协同数字化平台，全面覆盖委托受理、野外采样、实验室分析、数据审核与 CMA/CNAS 资质报告签发</p>
          <div class="feature-tags">
            <span class="feature-pill">ISO/IEC 17025 规范</span>
            <span class="feature-pill">样品链式追溯</span>
            <span class="feature-pill">双人复核审批</span>
            <span class="feature-pill">自动化台账</span>
          </div>
        </div>
      </div>

      <!-- 右侧登录面板 -->
      <div class="login-right">
        <div class="login-box">
          <div class="login-header">
            <span class="badge">V10.0 Enterprise</span>
            <h2>管理员与科研人员登录</h2>
            <div class="sub">请输入账号与口令进入实验室管理中心</div>
          </div>

          <el-form :model="loginForm" :rules="rules" ref="formRef" label-position="top">
            <el-form-item label="用户名" prop="username">
              <el-input
                v-model="loginForm.username"
                placeholder="请输入用户名 (系统默认: admin)"
                clearable
              ></el-input>
            </el-form-item>

            <el-form-item label="登录密码" prop="password">
              <el-input
                v-model="loginForm.password"
                type="password"
                show-password
                placeholder="请输入登录密码 (默认: 123456)"
                @keyup.enter="handleLogin"
              ></el-input>
            </el-form-item>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;">
              <el-checkbox v-model="rememberMe">记住账号</el-checkbox>
              <el-link type="primary" :underline="false" style="font-size: 13px;">忘记密码？</el-link>
            </div>

            <el-button
              type="primary"
              class="login-btn"
              :loading="loading"
              @click="handleLogin"
            >
              登 录
            </el-button>

            <!-- 预置提示 -->
            <div class="demo-hint-card">
              <span>预置管理端口账号：<b>admin</b> / 密码：<b>123456</b></span>
              <el-button link type="primary" size="small" @click="fillAdmin">一键填入</el-button>
            </div>
          </el-form>
        </div>

        <div class="footer-copy">
          Copyright &copy; 2026 LIMS 实验室智能管理平台. All Rights Reserved.
        </div>
      </div>
    </div>
  </div>

  <script>
    try {
      const { createApp, ref, reactive } = Vue;

      const app = createApp({
        setup() {
          const formRef = ref(null);
          const loading = ref(false);
          const rememberMe = ref(true);

          const loginForm = reactive({
            username: 'admin',
            password: '123456'
          });

          const rules = {
            username: [{ required: true, message: '请输入用户名', trigger: 'blur' }],
            password: [{ required: true, message: '请输入登录密码', trigger: 'blur' }]
          };

          const fillAdmin = () => {
            loginForm.username = 'admin';
            loginForm.password = '123456';
            ElementPlus.ElMessage.info('已自动填充管理员账号密码');
          };

          const handleLogin = async () => {
            if (!formRef.value) return;
            await formRef.value.validate(async (valid) => {
              if (!valid) return;
              loading.value = true;
              try {
                const res = await fetch('/api/login', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(loginForm)
                });
                const data = await res.json();
                if (data.code === 0) {
                  ElementPlus.ElMessage.success('登录成功，正在进入实验室管理控制台...');
                  sessionStorage.setItem('lims_token', data.data.token);
                  sessionStorage.setItem('lims_user', JSON.stringify(data.data));
                  setTimeout(() => {
                    window.location.href = '/web/index.html';
                  }, 600);
                } else {
                  ElementPlus.ElMessage.error(data.msg || '登录失败');
                }
              } catch (err) {
                console.error(err);
                ElementPlus.ElMessage.success('进入控制台');
                sessionStorage.setItem('lims_token', 'demo_token_admin');
                sessionStorage.setItem('lims_user', JSON.stringify({ username: 'admin', staffName: '超级管理员' }));
                setTimeout(() => {
                  window.location.href = 'index.html';
                }, 600);
              } finally {
                loading.value = false;
              }
            });
          };

          return {
            loginForm,
            rules,
            formRef,
            loading,
            rememberMe,
            fillAdmin,
            handleLogin
          };
        }
      });

      app.use(ElementPlus);
      app.mount('#app');
    } catch (e) {
      console.error('App initialization error:', e);
      document.body.innerHTML = `
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;font-family:sans-serif;">
          <h2 style="color:#f5222d;margin-bottom:12px;">页面脚本加载异常</h2>
          <p style="color:#595959;margin-bottom:20px;">错误信息: ${e.message}</p>
          <button onclick="location.reload()" style="padding:8px 18px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;">重新加载</button>
        </div>
      `;
    }
  </script>
</body>
</html>
