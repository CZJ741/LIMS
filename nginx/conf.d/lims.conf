# 限流配置：每秒最多 50 次请求，突发支持 20 次
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

upstream lims_backend {
    server lims-app:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 客户端上传文件大小限制（与 LIMS 报告、图谱、设备文件匹配）
    client_max_body_size 100M;

    # 1. 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. 后端 API 反向代理与限流
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://lims_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时时间设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # 3. Swagger / OpenAPI 文档直通
    location ~* ^/(doc\.html|webjars/|v3/api-docs/|swagger-ui/) {
        proxy_pass http://lims_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. HTTPS 证书配置占位
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/lims.crt;
    # ssl_certificate_key /etc/nginx/ssl/lims.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # 错误页面处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
